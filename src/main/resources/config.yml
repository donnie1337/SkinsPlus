# SkinsPlus
# O NameMC será usado como base de catálogo/referência de skins.
# Consultas externas deverão ser assíncronas e armazenadas em cache.

cache:
  enabled: true
  ttl-hours: 24

namemc:
  enabled: true
  base-url: "https://namemc.com"


# Perfis usados pelo /skin random.
# O plugin embaralha a lista e tenta os perfis até encontrar uma skin válida.
random-skins:
  names:
    - Eliciu
    - Notch
    - jeb_
    - Dinnerbone
    - Technoblade
    - Dream
    - Sapnap
    - GeorgeNotFound
